# Production-стек для VPS. HTTPS/проксирование делает ваш Nginx Proxy Manager
# (внешняя docker-сеть proxy-network), поэтому здесь портов наружу почти нет —
# NPM ходит к контейнерам web/server по именам внутри общей сети.
#
# Запуск:  docker compose -f docker-compose.prod.yml --env-file .env up -d --build
# Переменные — в .env рядом (см. .env.prod.example).

services:
  postgres:
    image: postgres:16-alpine
    container_name: videoner-postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-postgres}
      POSTGRES_DB: downloader
    volumes:
      - pgdata:/var/lib/postgresql/data
    networks: [internal]
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d downloader"]
      interval: 5s
      timeout: 3s
      retries: 10

  telegram-bot-api:
    image: aiogram/telegram-bot-api:latest
    container_name: videoner-botapi
    restart: unless-stopped
    environment:
      TELEGRAM_API_ID: ${TELEGRAM_API_ID}
      TELEGRAM_API_HASH: ${TELEGRAM_API_HASH}
      TELEGRAM_LOCAL: "1"
    volumes:
      - botapi_data:/var/lib/telegram-bot-api
    networks: [internal]

  # Генератор PO-токенов для YouTube (обход антибот-проверки на IP дата-центров).
  # Версия образа должна совпадать с BGUTIL_VERSION в server/Dockerfile.
  bgutil-provider:
    image: brainicism/bgutil-ytdlp-pot-provider:1.3.1
    container_name: videoner-bgutil
    restart: unless-stopped
    networks: [internal]

  # Резерв для Threads. Основной путь — плагин yt-dlp, который берёт данные из
  # SSR по UA поискового робота; он живой, но держится на том, что Meta не
  # сверяет этот UA с reverse DNS. Начнёт сверять — плагин сам перейдёт сюда,
  # а этот контейнер откроет пост в настоящем Chromium.
  # Сюда же уходят короткие ссылки threads.net/t/<code>: их SSR не отдаёт.
  # Chromium поднимается только по требованию и гаснет через 5 минут простоя,
  # поэтому в покое контейнер стоит около 60 МБ.
  threads-resolver:
    build: ./threads-resolver
    container_name: videoner-threads-resolver
    restart: unless-stopped
    environment:
      # Прокси тут не опция, а условие работы: настоящему браузеру с IP
      # дата-центра Threads показывает заглушку «страница не найдена» вместо
      # поста, а через резидентный IP тот же Chromium открывает пост нормально
      # (замер 10.08.2026). Переиспользуем тот же ISP-прокси, что и для YouTube;
      # трафик экономим, отбрасывая картинки, шрифты и видеопотоки — резолверу
      # нужен только JSON в разметке, сам файл сервер потом качает напрямую.
      THREADS_PROXY_URL: ${YOUTUBE_PROXY_URL}
    # Страховка от повисшего браузера: без лимита один зависший Chromium может
    # выбрать всю свободную память VPS и утянуть за собой postgres и бота.
    mem_limit: 1g
    networks: [internal]

  server:
    build: ./server
    container_name: videoner-server
    restart: unless-stopped
    environment:
      DATABASE_URL: postgresql://postgres:${POSTGRES_PASSWORD:-postgres}@postgres:5432/downloader?schema=public
      NODE_ENV: production
      PORT: "3001"
      # CORS: браузер напрямую слушает SSE-прогресс с этого домена
      ALLOWED_ORIGINS: ${PUBLIC_DOMAIN}
      # Фиксированный API-ключ, чтобы совпадал с web и bot (seed создаёт его идемпотентно)
      SEED_API_KEY: ${API_KEY}
      SEED_ADMIN_EMAIL: ${ADMIN_EMAIL:-admin@localhost}
      # Алерт в Telegram админу, когда YouTube требует обновить cookies
      BOT_TOKEN: ${BOT_TOKEN}
      ADMIN_CHAT_ID: ${ADMIN_CHAT_ID}
      # Статический ISP-прокси (IPRoyal) для YouTube — обходит блокировку по IP дата-центра VPS
      YOUTUBE_PROXY_URL: ${YOUTUBE_PROXY_URL}
      # Адрес резервного резолвера Threads. У плагина зашит тот же адрес по
      # умолчанию, но здесь он задан явно: иначе связь плагина с именем сервиса
      # ниоткуда не видна, и переименование сервиса ломало бы резерв молча.
      # Переменная доезжает до yt-dlp сама — spawn наследует окружение.
      THREADS_RESOLVER_URL: http://threads-resolver:4417
      # Одна подсказка человеку, который запустил бота и за 48 часов не прислал
      # ни одной ссылки (см. server/src/modules/nudge). Включено ТОЛЬКО здесь:
      # у staging своя БД, но тот же BOT_TOKEN, и без этого флага он писал бы
      # тем же живым людям второй раз. В docker-compose.staging.yml не добавлять.
      NUDGE_ENABLED: "true"
    volumes:
      - downloads:/app/dist/downloads
      # Куки для YouTube/Facebook/Vimeo и т.п. лежат в cookies/cookies.txt.
      # Пустой файл-заглушка игнорируется (сервер проверяет непустоту).
      #
      # Монтируется КАТАЛОГ, а не сам файл — и менять это обратно нельзя.
      # yt-dlp при ротации сессионных токенов не дописывает cookies.txt, а
      # подменяет его новым файлом; inode меняется, а bind-mount одиночного
      # файла привязан именно к inode — связь с хостом рвалась молча. После
      # этого контейнер работал с отсоединённой копией: ротированные куки
      # терялись при рестарте, а правки на хосте до контейнера не доходили
      # (поймано 31.07.2026). Каталог монтируется по пути, подмена файла
      # внутри него связь не рвёт.
      #
      # Обязательно НЕ read-only: yt-dlp пишет в файл при каждом запуске,
      # на :ro падает с "OSError: Read-only file system" и роняет весь запрос.
      - ./server/cookies:/app/cookies
    depends_on:
      postgres:
        condition: service_healthy
      bgutil-provider:
        condition: service_started
      threads-resolver:
        condition: service_started
    networks: [internal, proxy]

  bot:
    build: ./bot
    container_name: videoner-bot
    restart: unless-stopped
    environment:
      BOT_TOKEN: ${BOT_TOKEN}
      API_URL: http://server:3001
      API_KEY: ${API_KEY}
      # Локальный Bot API сервер — лимит файлов 2 ГБ
      BOT_API_ROOT: http://telegram-bot-api:8081
      # Кому доступны /grant и /revoke (свой Telegram ID — у @userinfobot)
      ADMIN_TELEGRAM_ID: ${ADMIN_TELEGRAM_ID}
      # Канал для кнопки «Поделиться» (@имя или числовой -100…). Бот должен
      # быть в нём администратором с правом публикации. Пусто — кнопка не
      # показывается вовсе, поведение бота прежнее.
      #
      # Публикуется ТОЛЬКО то, что пользователь выбрал сам и подтвердил, что
      # вправе этим делиться. Автопостинг всего скачанного обсуждался и
      # отклонён: ссылки пользователей — это их история просмотров.
      TELEGRAM_CHANNEL_ID: ${TELEGRAM_CHANNEL_ID:-}
    depends_on: [server, telegram-bot-api]
    networks: [internal]

  web:
    build:
      context: ./web
      args:
        NEXT_PUBLIC_APP_URL: https://${PUBLIC_DOMAIN}
        NEXT_PUBLIC_API_URL: https://${PUBLIC_DOMAIN}
        NEXT_PUBLIC_TURNSTILE_SITE_KEY: ${NEXT_PUBLIC_TURNSTILE_SITE_KEY}
        NEXT_PUBLIC_TELEGRAM_BOT_USERNAME: ${NEXT_PUBLIC_TELEGRAM_BOT_USERNAME}
        NEXT_PUBLIC_TELEGRAM_BOT_ID: ${NEXT_PUBLIC_TELEGRAM_BOT_ID}
        # Счётчик Яндекс.Метрики. Задан ТОЛЬКО здесь и намеренно отсутствует
        # в docker-compose.staging.yml: staging собирается из того же кода, и
        # без этого его трафик попадал бы в статистику боевого сайта, а
        # вебвизор писал бы отладочные сессии. Нет переменной — нет счётчика.
        NEXT_PUBLIC_YANDEX_METRIKA_ID: ${NEXT_PUBLIC_YANDEX_METRIKA_ID}
    container_name: videoner-web
    restart: unless-stopped
    environment:
      NODE_ENV: production
      NEXT_PUBLIC_APP_URL: https://${PUBLIC_DOMAIN}
      NEXT_PUBLIC_API_URL: https://${PUBLIC_DOMAIN}
      # Серверный прокси Next.js ходит к API по внутренней сети, не через публичный домен
      API_INTERNAL_URL: http://server:3001
      API_KEY: ${API_KEY}
      # Cloudflare Turnstile: секрет нужен только серверному прокси (route.ts),
      # проверяющему токен через siteverify до похода в NestJS API.
      TURNSTILE_SECRET: ${TURNSTILE_SECRET}
      # Подпись сессионных JWT для входа через Telegram Login Widget
      SESSION_SECRET: ${SESSION_SECRET}
    depends_on: [server]
    networks: [internal, proxy]

networks:
  internal:
  proxy:
    external: true
    name: ${NPM_NETWORK:-proxy-network}

volumes:
  pgdata:
  botapi_data:
  downloads:
