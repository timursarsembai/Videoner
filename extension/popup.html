<!doctype html>
<html>
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Videoner</title>
    <link rel="stylesheet" href="popup.css" />
  </head>
  <body>
    <header class="header">
      <img src="icons/icon-32.png" alt="" width="22" height="22" />
      <span class="brand">Videoner</span>
      <select id="lang" class="lang"></select>
      <button id="history-toggle" class="icon-button" type="button">
        <svg viewBox="0 0 24 24" width="18" height="18" aria-hidden="true" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M3 12a9 9 0 1 0 3-6.7L3 8"/><path d="M3 3v5h5"/><path d="M12 7v5l3 2"/></svg>
      </button>
      <button id="close" class="close" type="button" hidden>×</button>
    </header>
    <div id="update" class="update" hidden></div>
    <main id="app" aria-live="polite"></main>
    <section id="history" class="history" hidden></section>
    <section id="playlist" class="playlist" hidden></section>
    <footer id="account" class="account" hidden></footer>
    <script type="module" src="popup.js"></script>
  </body>
</html>
